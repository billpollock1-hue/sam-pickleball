const DATES = ["2026-09-11", "2026-09-10", "2026-09-09", "2026-09-08", "2026-09-07", "2026-09-04", "2026-09-03", "2026-09-02", "2026-09-01", "2026-08-31", "2026-08-28"];

function isWL(v) { return typeof v === 'string' && v.startsWith('WL'); }

function render(dateStr) {
  const d = DATA[dateStr];
  if (!d) return;

  // Print header
  const dt = new Date(dateStr + 'T12:00:00');
  document.getElementById('print-header').textContent =
    dt.toLocaleDateString('en-US', {weekday:'long', year:'numeric',
      month:'long', day:'numeric'}) + ' — SAM 6AM Shootout';

  const cols = d.cols || [];
  const rows = d.rows || [];

  let h = '<table><thead><tr>';
  h += '<th class="left" style="width:72px">Joined</th>';
  h += '<th class="left" style="min-width:160px">Player</th>';
  h += '<th style="width:44px">SU#</th>';
  for (const c of cols)
    h += `<th style="width:82px">${c.h}</th>`;
  h += '</tr></thead><tbody>';

  for (const p of rows) {
    h += `<tr${p.w ? ' class="wd"' : ''}>`;
    h += `<td class="ts">${p.j}</td>`;
    h += `<td class="name">${p.n}</td>`;
    h += `<td class="${isWL(p.o) ? 'wl' : 'order'}">${p.o}</td>`;
    for (const rev of p.r) {
      if (!rev) { h += '<td class="empty"></td>'; continue; }
      if (rev.t === 'wd')       { h += `<td class="wd-cell" title="${rev.title}">${rev.v}</td>`; continue; }
      if (rev.t === 'auto')     { h += `<td class="auto-cell" title="${rev.title}">${rev.v}</td>`; continue; }
      if (rev.t === 'promoted') { h += `<td class="promo">${rev.v}</td>`;   continue; }
      h += `<td class="${isWL(rev.v) ? 'wl' : 'rev'}">${rev.v}</td>`;
    }
    h += '</tr>';
  }

  h += '</tbody></table>';
  document.getElementById('tbl').innerHTML = h;
}

const sel = document.getElementById('date-select');

// Determine "today" and whether the 8:15 AM cutoff has passed, in Mountain
// Standard Time (MST — America/Phoenix, no DST, matches the run_all.sh scrape
// cutoff). Before 8:15 AM on a play date, that date's session hasn't been
// played yet, so it still counts as the next play date. After 8:15 AM,
// it's considered played and the default should roll forward to the next
// date that actually has a signup sheet.
function arizonaNow() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Phoenix',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(new Date());
  const map = {};
  parts.forEach(p => { map[p.type] = p.value; });
  return {
    dateStr: `${map.year}-${map.month}-${map.day}`,
    hour: parseInt(map.hour, 10),
    minute: parseInt(map.minute, 10)
  };
}

const az = arizonaNow();
const cutoffPassed = (az.hour > 8) || (az.hour === 8 && az.minute >= 15);

// Keep a rolling 7-day lookback plus every future date; drop anything older.
function shiftDate(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
const sevenDaysAgoStr = shiftDate(az.dateStr, -7);
const allOpts = Array.from(sel.options);
// Kept (not discarded) so "Show older sessions" can restore them later --
// these are still valid DOM nodes, just detached from the <select>.
const olderOpts = [];
allOpts.forEach(opt => {
  if (opt.value < sevenDaysAgoStr) {
    olderOpts.push(opt);
    opt.remove();
  }
});
// Options arrive sorted newest-first (see generate_viewer()); reverse so the
// dropdown reads chronologically, oldest (7 days back) through furthest future.
const remaining = Array.from(sel.options);
sel.innerHTML = '';
remaining.reverse().forEach(opt => sel.appendChild(opt));
// Fallback: if the lookback window removed everything, restore the most
// recent date on record so the page isn't blank.
if (sel.options.length === 0 && DATES.length > 0) {
  const opt = document.createElement('option');
  opt.value = DATES[DATES.length - 1];
  opt.text = DATES[DATES.length - 1];
  sel.appendChild(opt);
}
// Default selection: the next upcoming play date -- today before the 8:15 AM
// MST cutoff (that session hasn't been played yet), otherwise the first date
// strictly after today. Falls back to the latest date on record if nothing
// in the future exists yet.
function isUpcoming(v) {
  if (v > az.dateStr) return true;
  if (v === az.dateStr && !cutoffPassed) return true;
  return false;
}
let defaultIdx = Array.from(sel.options).findIndex(o => isUpcoming(o.value));
if (defaultIdx === -1) defaultIdx = sel.options.length - 1;
sel.selectedIndex = defaultIdx;

// Restore a manually-selected date carried over from a periodic auto-reload
// (see setInterval below), if that date still appears in the dropdown --
// otherwise the reload would silently snap back to the default date while
// someone is actively reviewing an older session.
const preservedDate = new URLSearchParams(location.search).get('d');
if (preservedDate) {
  const match = Array.from(sel.options).find(o => o.value === preservedDate);
  if (match) sel.value = preservedDate;
}

// Toggle handler for "Show older sessions" -- olderOpts holds every date
// older than the 7-day lookback window, still valid DOM option nodes just
// detached from the <select> above. Re-inserted in olderOpts' original
// newest-first order, each one placed before the current first child, so
// the final order ends up oldest-first overall (matching the rest of the
// dropdown's chronological ordering).
let olderSessionsShown = false;
function toggleOlderSessions() {
  const btn = document.getElementById('older-btn');
  if (!olderSessionsShown) {
    olderOpts.forEach(opt => sel.insertBefore(opt, sel.firstChild));
    olderSessionsShown = true;
    btn.textContent = 'Hide older sessions';
  } else {
    olderOpts.forEach(opt => opt.remove());
    olderSessionsShown = false;
    btn.textContent = 'Show older sessions';
    if (sel.selectedIndex === -1 && sel.options.length > 0) {
      sel.selectedIndex = 0;
      render(sel.value);
    }
  }
}

sel.addEventListener('change', () => render(sel.value));
render(sel.value);

// Forces a genuine network fetch bypassing any cache, carrying the current
// date selection forward so it isn't lost -- used both by the manual
// Refresh button and the periodic timer below.
function forceRefresh() {
  const params = new URLSearchParams(location.search);
  params.set('_cb', Date.now());
  params.set('d', sel.value);
  location.replace(location.pathname + '?' + params.toString());
}

// Periodic freshness re-check for tabs left open a while.
setInterval(forceRefresh, 5 * 60 * 1000);

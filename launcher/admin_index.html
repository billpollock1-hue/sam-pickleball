<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Pickleball — Admin</title>
<style>
  :root {
    --blue-dark: #1F4E79;
    --blue-mid:  #2E75B6;
    --blue-light:#D6E4F0;
    --rust:      #b3543a;
    --gold:      #C9A84C;
    --text:      #333333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Calibri, Arial, sans-serif;
    color: var(--text);
    background: #f7f9fc;
    min-height: 100vh;
  }
  header {
    background: var(--blue-dark);
    color: #fff;
    padding: 26px 24px;
    text-align: center;
  }
  header h1 { font-size: 24px; letter-spacing: 0.3px; }
  header p  { font-size: 14px; opacity: 0.85; margin-top: 6px; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.card {
    display: block;
    background: #fff;
    border: 1px solid #dbe4ee;
    border-left: 5px solid var(--blue-mid);
    border-radius: 8px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    transition: box-shadow 0.15s, transform 0.15s;
  }
  a.card:hover {
    box-shadow: 0 3px 10px rgba(31, 78, 121, 0.15);
    transform: translateY(-1px);
  }
  a.card h2 {
    font-size: 17px;
    color: var(--blue-dark);
    margin-bottom: 4px;
  }
  a.card p { font-size: 13.5px; color: #555; line-height: 1.4; }

  a.card.group-c { border-left-color: var(--rust); background: rgba(179, 84, 58, 0.16); }

  footer {
    text-align: center;
    font-size: 12px;
    color: #8a97a8;
    padding: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>SAM Pickleball — Admin</h1>
  <p>Operational tools — not part of the public site</p>
</header>

<main>
  <a class="card group-c" href="/launcher">
    <h2>Shootout Launcher</h2>
    <p>Configure and monitor the automated daily shootout creation — mode, autolaunch time, and the recent launch log.</p>
  </a>
</main>

<footer>
  Reachable on your home network only — not published to GitHub Pages.
</footer>

</body>
</html>

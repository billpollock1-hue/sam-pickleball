<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Pickleball — Record a Date</title>
<style>
  :root {
    --blue-dark: #1F4E79;
    --blue-mid:  #2E75B6;
    --rust:      #b3543a;
    --text:      #333333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Calibri, Arial, sans-serif;
    color: var(--text);
    background: #f7f9fc;
    min-height: 100vh;
  }
  header {
    background: var(--blue-dark);
    color: #fff;
    padding: 26px 24px;
    text-align: center;
  }
  header h1 { font-size: 24px; letter-spacing: 0.3px; }
  header p  { font-size: 14px; opacity: 0.85; margin-top: 6px; }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  a.back {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--blue-mid);
    text-decoration: none;
    font-size: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid #dbe4ee;
    border-left: 5px solid var(--rust);
    border-radius: 8px;
    padding: 20px;
  }
  label { display: block; font-size: 14px; font-weight: bold; margin: 14px 0 6px; color: var(--blue-dark); }
  label:first-of-type { margin-top: 0; }
  input[type="date"], select {
    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 5px; font-family: inherit;
  }
  .radio-row { display: flex; gap: 16px; margin-top: 4px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; font-weight: normal; font-size: 14px; margin: 0; color: var(--text); }
  .radio-row input { width: auto; }
  .hint { font-size: 12.5px; color: #777; margin-top: 4px; line-height: 1.4; }
  button {
    margin-top: 18px; width: 100%; padding: 10px;
    background: var(--blue-dark); color: #fff; border: none;
    border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #163a5c; }
  button:disabled { background: #9ab; cursor: not-allowed; }
  #status { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13.5px; display: none; }
  #status.ok { display: block; background: #e6f4ea; color: #276221; border: 1px solid #b6dfc0; }
  #status.err { display: block; background: #fbe9e7; color: #9C3B1B; border: 1px solid #f2b8ad; }
  #status.pending { display: block; background: #fff8e1; color: #8a6d1a; border: 1px solid #f0dfa0; }

  .log-card {
    background: #fff;
    border: 1px solid #dbe4ee;
    border-radius: 8px;
    padding: 20px;
    margin-top: 20px;
  }
  .log-card h2 { font-size: 16px; color: var(--blue-dark); margin-bottom: 12px; }
  table.log-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.log-table th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.03em; color: #888; border-bottom: 2px solid #eee;
    padding: 5px 6px;
  }
  table.log-table td { padding: 6px; border-bottom: 1px solid #f0f0f0; }
  .type-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 10px;
  }
  .type-badge.none   { background: rgba(179, 84, 58, 0.16); color: var(--rust); }
  .type-badge.single { background: rgba(46, 117, 182, 0.16); color: var(--blue-mid); }
  #logEmpty { font-size: 13.5px; color: #777; }
</style>
</head>
<body>

<header>
  <h1>Record a Date</h1>
  <p>Declare a no-shootout or single-shootout weekday</p>
</header>

<main>
  <a class="back" href="/">&#8592; Back to admin menu</a>

  <div class="card">
    <label for="dateInput">Date</label>
    <input type="date" id="dateInput">

    <label>Type</label>
    <div class="radio-row">
      <label><input type="radio" name="dateType" value="none" checked> No shootout</label>
      <label><input type="radio" name="dateType" value="single"> Single shootout</label>
    </div>
    <div class="hint" id="typeHint">
      Marks the date as fully cancelled — the next playdate's court assignments will
      immediately be treated as final instead of preliminary.
    </div>

    <button id="submitBtn" onclick="submitDate()">Record Date</button>
    <div id="status"></div>
  </div>

  <div class="log-card">
    <h2>Previously Recorded Dates</h2>
    <div id="logEmpty" style="display:none;">No dates recorded yet.</div>
    <table class="log-table" id="logTable" style="display:none;">
      <thead>
        <tr><th>Date</th><th>Type</th></tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</main>

<script>
const NONE_HINT = "Marks the date as fully cancelled — the next playdate's court assignments will immediately be treated as final instead of preliminary.";
const SINGLE_HINT = "Scrapes that day's single shootout, merges it into history, rebuilds the rating engine, and refreshes court assignments — this can take a couple minutes, please wait for it to finish.";

document.querySelectorAll('input[name="dateType"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('typeHint').textContent = r.value === 'none' ? NONE_HINT : SINGLE_HINT;
  });
});

function formatDateDisplay(dateStr) {
  // dateStr is "YYYY-MM-DD" -- parse as local, not UTC, to avoid an
  // off-by-one-day display shift.
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

async function loadRecordedDates() {
  try {
    const resp = await fetch('/api/recorded-dates');
    const entries = await resp.json();
    const tbody = document.getElementById('logBody');
    const table = document.getElementById('logTable');
    const empty = document.getElementById('logEmpty');

    if (!entries.length) {
      empty.style.display = 'block';
      table.style.display = 'none';
      return;
    }

    tbody.innerHTML = entries.map(e => `
      <tr>
        <td>${formatDateDisplay(e.date)}</td>
        <td><span class="type-badge ${e.type}">${e.type === 'none' ? 'No shootout' : 'Single shootout'}</span></td>
      </tr>
    `).join('');
    table.style.display = 'table';
    empty.style.display = 'none';
  } catch (e) {
    document.getElementById('logEmpty').textContent = 'Could not load recorded dates.';
    document.getElementById('logEmpty').style.display = 'block';
  }
}

async function submitDate() {
  const date = document.getElementById('dateInput').value;
  const type = document.querySelector('input[name="dateType"]:checked').value;
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submitBtn');

  if (!date) {
    statusEl.className = 'err';
    statusEl.textContent = 'Please pick a date first.';
    return;
  }

  btn.disabled = true;
  statusEl.className = 'pending';
  statusEl.textContent = type === 'single'
    ? 'Scraping, merging, and rebuilding — this may take a couple minutes...'
    : 'Recording...';

  try {
    const resp = await fetch('/api/record-date', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, type }),
    });
    const data = await resp.json();
    if (resp.ok) {
      statusEl.className = 'ok';
      statusEl.textContent = `Done: ${date} recorded as "${type === 'none' ? 'no shootout' : 'single shootout'}" — ${data.status}.`;
      loadRecordedDates();
    } else {
      statusEl.className = 'err';
      statusEl.textContent = `Error: ${data.error || 'unknown error'}`;
    }
  } catch (e) {
    statusEl.className = 'err';
    statusEl.textContent = `Network error: ${e}`;
  } finally {
    btn.disabled = false;
  }
}

loadRecordedDates();
</script>
</body>
</html>
